name: emorfiq-scheduler

x-runtime: &runtime
  image: emorfiq-adapter-php
  build:
    context: .
    target: runtime
  volumes:
    - runtime:/app/storage
  restart: unless-stopped

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:18.6-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: emorfiq
      POSTGRES_USER: emorfiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emorfiq_local_dev}
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  adminer:
    image: adminer:6.1.1-standalone@sha256:74f29c416e148b98305e84446a18db7cd2c1038264dec464359d36774ef080ce
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    <<: *runtime
    environment:
      PHP_CLI_SERVER_WORKERS: "4"
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:8080"
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 10

  scheduler:
    <<: *runtime
    command: ["supercronic", "-quiet", "-passthrough-logs", "/app/docker/crontab"]
    init: true
    healthcheck:
      test: ["CMD", "pgrep", "-x", "supercronic"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  check:
    profiles: ["tools"]
    image: emorfiq-adapter-tools
    build:
      context: .
      target: tools

  docs:
    profiles: ["docs"]
    image: squidfunk/mkdocs-material@sha256:51b87149d227691486b5f08993d28c65ca7e4990010664b697265b8e6fcd5287
    command: ["serve", "--strict", "--config-file", "mkdocs.local.yml", "--dev-addr", "0.0.0.0:8000"]
    user: "65532:65532"
    working_dir: /source/tools/docs
    environment:
      DOCS_SITE_URL: ${DOCS_SITE_URL:-https://pupitooo.github.io/emorfiq-adapter/}
    volumes:
      - .:/source:ro
    ports:
      - "127.0.0.1:${DOCS_PORT:-8089}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2).read()"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  runtime:
  postgres_data:
