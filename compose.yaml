name: emorfiq-scheduler

x-runtime: &runtime
  image: emorfiq-adapter-php
  build:
    context: .
    target: runtime
  volumes:
    - runtime:/app/storage
  restart: unless-stopped

services:
  web:
    <<: *runtime
    environment:
      PHP_CLI_SERVER_WORKERS: "4"
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:8080"
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 10

  scheduler:
    <<: *runtime
    command: ["supercronic", "-quiet", "-passthrough-logs", "/app/docker/crontab"]
    init: true
    healthcheck:
      test: ["CMD", "pgrep", "-x", "supercronic"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  check:
    profiles: ["tools"]
    image: emorfiq-adapter-tools
    build:
      context: .
      target: tools

  docs:
    profiles: ["docs"]
    # Match the Material for MkDocs image and visual theme used by E2B.
    image: squidfunk/mkdocs-material@sha256:51b87149d227691486b5f08993d28c65ca7e4990010664b697265b8e6fcd5287
    command: ["serve", "--strict", "--config-file", "mkdocs.local.yml", "--dev-addr", "0.0.0.0:8000"]
    user: "65532:65532"
    working_dir: /source/docs/site
    environment:
      DOCS_SITE_URL: ${DOCS_SITE_URL:-https://pupitooo.github.io/emorfiq-adapter/}
    volumes:
      - .:/source:ro
    ports:
      - "127.0.0.1:${DOCS_PORT:-8089}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2).read()"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  runtime:
