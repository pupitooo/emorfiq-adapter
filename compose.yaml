name: emorfiq-scheduler

x-runtime: &runtime
  image: emorfiq-adapter-php
  build:
    context: .
    target: runtime
  volumes:
    - runtime:/app/storage
  restart: unless-stopped

services:
  web:
    <<: *runtime
    environment:
      PHP_CLI_SERVER_WORKERS: "4"
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:8080"
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 10

  scheduler:
    <<: *runtime
    command: ["supercronic", "-quiet", "-passthrough-logs", "/app/docker/crontab"]
    init: true
    healthcheck:
      test: ["CMD", "pgrep", "-x", "supercronic"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  check:
    profiles: ["tools"]
    image: emorfiq-adapter-tools
    build:
      context: .
      target: tools

volumes:
  runtime:
