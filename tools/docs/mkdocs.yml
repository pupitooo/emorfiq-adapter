site_name: Emorfiq Scheduler Adapter
site_description: Architecture, task services, scheduler configuration, and development guides
site_url: !ENV [DOCS_SITE_URL, 'https://pupitooo.github.io/emorfiq-adapter/']
docs_dir: ../../docs
exclude_docs: |
  /CODING_STANDARDS.md
  /STRUCTURE_PROPOSAL.md
site_dir: /tmp/emorfiq-docs-site
strict: true
hooks:
  - hooks.py
watch:
  - ../../README.md
theme:
  name: material
  language: en
  font: false
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - Intro: index.md
  - Application:
      - Architecture: architecture.md
      - Adapter:
          - Overview: adapter/index.md
          - LaravelAdapter: adapter/laravel.md
      - Tasks:
          - Services: task-services.md
          - Resolution: task-resolution.md
          - Execution: task-execution.md
  - Execution:
      - Coordination: execution/coordination.md
      - Recovery: execution/recovery.md
      - External effects: execution/external-effects.md
      - Verification: execution/verification.md
  - Configuration:
      - JSON format: configuration/format.md
      - Cron syntax: configuration/cron.md
      - Concurrency: configuration/concurrency.md
      - Loading: configuration/loading.md
      - Test cases: configuration/tests.md
  - Development:
      - Local environment: development/local-environment.md
      - Database: development/database.md
      - Migrations: development/migrations.md
      - Log viewer: development/log-viewer.md
      - Documentation: development/documentation.md
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pupitooo/emorfiq-adapter
