site_name: Emorfiq Scheduler Adapter
site_description: Project overview and JSON scheduler configuration reference
site_url: !ENV [DOCS_SITE_URL, 'https://pupitooo.github.io/emorfiq-adapter/']
docs_dir: content
site_dir: /tmp/emorfiq-docs-site
strict: true
hooks:
  - hooks.py
watch:
  - ../../README.md
theme:
  name: material
  language: en
  font: false
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - Home: index.md
  - Configuration:
      - JSON structure: scheduler-configuration.md
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pupitooo/emorfiq-adapter
