site_name: Emorfiq Scheduler Adapter
site_description: Architecture, task services, scheduler configuration, and development guides
site_url: !ENV [DOCS_SITE_URL, 'https://pupitooo.github.io/emorfiq-adapter/']
docs_dir: ../../docs
exclude_docs: |
  /CODING_STANDARDS.md
  /STRUCTURE_PROPOSAL.md
not_in_nav: |
  /execution/verification.md
site_dir: /tmp/emorfiq-docs-site
strict: true
hooks:
  - hooks.py
watch:
  - ../../README.md
theme:
  name: material
  language: en
  font: false
  features:
    - navigation.top
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - Intro: index.md
  - Code overview: architecture.md
  - Adapter:
      - Overview: adapter/index.md
      - Laravel integration: adapter/laravel.md
  - Configuration:
      - Scheduler JSON: configuration/format.md
      - Configuration loading: configuration/loading.md
      - Cron syntax: configuration/cron.md
      - Concurrency: configuration/concurrency.md
  - Tasks:
      - Registration: task-services.md
      - Dependency resolution: task-resolution.md
      - Execution outcomes: task-execution.md
  - Mutex layers: execution/mutex-layers.md
  - Coordination:
      - Admission and completion: execution/coordination.md
      - History and locks: execution/history.md
      - Storage transactions: execution/storage.md
  - Failure and recovery:
      - Recovery: execution/recovery.md
      - External effects: execution/external-effects.md
  - Verification:
      - Concurrency demo: development/concurrency-demo.md
  - Development:
      - Local environment: development/local-environment.md
      - Server identity: development/server-identity.md
      - Service wiring: development/service-wiring.md
      - Database: development/database.md
      - Migrations: development/migrations.md
      - Adapter UI: development/adapter-ui.md
      - Documentation: development/documentation.md
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pupitooo/emorfiq-adapter
